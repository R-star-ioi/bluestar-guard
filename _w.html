<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1a2540}iframe{border:0;display:block}</style></head><body>
<iframe id="f" width="930" height="510"></iframe>
<script>
localStorage.setItem('lx_meta', JSON.stringify({gold:420,diamonds:3000,unlocked:{archer:true},levels:{archer:8},selected:'archer',maxLevel:10,selectedLevel:1,chests:{},weapons:[{uid:1,cls:'archer',tier:4,star:5}],equip:{archer:1},nextWuid:2}));
var f = document.getElementById('f');
f.src = '/index.html';
var ran = false;
setInterval(function(){
  try {
    var w = f.contentWindow, G = w && w.G;
    if (G && G.game && !ran) {
      ran = true;
      var GM = G.game;
      GM.startRun(3);
      G.Waves.state = 'rest';
      G.Waves.timer = 999;
      var st = G.Player.stats;
      st.vision = 2; G.Camera.setZoom(1 - 0.1 * st.vision);
      for (var i = 0; i < 30; i++) { if (GM.state !== 'playing') break; GM.update(0.033); }
      GM.render();
      // 模拟用户把窗口从 930 拉宽到 1080（改 iframe 尺寸 → 内部 window.innerWidth 变化）
      f.width = 1080;
      setTimeout(function(){
        try { GM.render(); GM.render(); } catch(e){}
      }, 100);
    }
  } catch(e) { document.title = 'FAIL ' + e; }
}, 400);
</script></body></html>
